<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative To-Do List</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }
    body {
        background: linear-gradient(135deg, #ffecd2, #fcb69f);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .container {
        background: rgba(255,255,255,0.2);
        backdrop-filter: blur(12px);
        padding: 20px;
        border-radius: 20px;
        width: 400px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(15px);}
        to {opacity: 1; transform: translateY(0);}
    }
    h1 {
        text-align: center;
        margin-bottom: 15px;
        color: #2c3e50;
    }
    .input-container {
        display: flex;
        gap: 5px;
        margin-bottom: 10px;
    }
    input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 14px;
    }
    button {
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #ff7675;
        color: white;
        transition: 0.3s;
    }
    button:hover {
        transform: scale(1.05);
        opacity: 0.9;
    }
    .action-buttons {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
        flex-wrap: wrap;
        gap: 5px;
    }
    .filter {
        margin-top: 5px;
        display: flex;
        justify-content: space-around;
    }
    .filter button {
        background: #0984e3;
    }
    ul {
        list-style: none;
        max-height: 250px;
        overflow-y: auto;
        padding: 5px;
    }
    li {
        background: rgba(255,255,255,0.6);
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: 0.3s;
    }
    li.completed {
        text-decoration: line-through;
        color: gray;
        background: rgba(200,200,200,0.6);
    }
    .delete-btn {
        background: #d63031;
        padding: 5px 10px;
        border-radius: 6px;
        color: white;
        border: none;
        cursor: pointer;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Creative To-Do List</h1>
    <div class="input-container">
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button onclick="addTask()">➕</button>
    </div>

    <div class="action-buttons">
        <button onclick="markAllComplete()">✔ Mark All</button>
        <button onclick="clearAll()">🗑 Clear All</button>
    </div>

    <div class="filter">
        <button onclick="filterTasks('all')">All</button>
        <button onclick="filterTasks('completed')">Completed</button>
        <button onclick="filterTasks('pending')">Pending</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script>
    let currentFilter = "all";
    document.addEventListener("DOMContentLoaded", loadTasks);

    function addTask() {
        let input = document.getElementById("taskInput");
        let taskValue = input.value.trim();
        if (!taskValue) return;
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        tasks.push({ text: taskValue, completed: false });
        localStorage.setItem("tasks", JSON.stringify(tasks));
        input.value = "";
        loadTasks();
    }

    function loadTasks() {
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        let list = document.getElementById("taskList");
        list.innerHTML = "";
        tasks.forEach((task, index) => {
            if (currentFilter === "completed" && !task.completed) return;
            if (currentFilter === "pending" && task.completed) return;
            let li = document.createElement("li");
            li.className = task.completed ? "completed" : "";
            li.innerHTML = `
                <span onclick="toggleTask(${index})">${task.text}</span>
                <button class="delete-btn" onclick="deleteTask(${index})">Del</button>
            `;
            list.appendChild(li);
        });
    }

    function toggleTask(index) {
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        tasks[index].completed = !tasks[index].completed;
        localStorage.setItem("tasks", JSON.stringify(tasks));
        loadTasks();
    }

    function deleteTask(index) {
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        tasks.splice(index, 1);
        localStorage.setItem("tasks", JSON.stringify(tasks));
        loadTasks();
    }

    function clearAll() {
        localStorage.removeItem("tasks");
        loadTasks();
    }

    function markAllComplete() {
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        tasks = tasks.map(task => ({ ...task, completed: true }));
        localStorage.setItem("tasks", JSON.stringify(tasks));
        loadTasks();
    }

    function filterTasks(type) {
        currentFilter = type;
        loadTasks();
    }
</script>
</body>
</html>
